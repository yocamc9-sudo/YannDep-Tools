name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Siapkan icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          IMG=$(ls assets/*.jpg assets/*.jpeg assets/*.png assets/*.webp 2>/dev/null | head -1)
          echo "Pakai foto: $IMG"
          convert "${IMG}[0]" -background white -gravity center -resize 1024x1024 -extent 1024x1024 PNG32:assets/icon-only.png
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
